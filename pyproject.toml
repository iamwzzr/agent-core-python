[project]
name = "agent-core-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "iamwzzr", email = "302461164+iamwzzr@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[project.scripts]
agent-core-python = "agent_core_python:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
